<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glamuro | Catálogo</title>
<link rel="icon" type="image/png" href="../Catalogo/img/png folha2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy: #45161F;
    --burgundy-deep: #2C0D14;
    --gold: #C49A69;
    --gold-light: #E4CDA5;
    --cream: #FBF6EF;
    --paper: #FFFFFF;
    --ink: #2B2320;
    --ink-soft: #6E6155;
    --line: #E5D9C4;
    --radius: 2px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  /* ---------- leaf divider (echoes the mark in the logo) ---------- */
  .leaf-divider{
    display:flex; align-items:center; justify-content:center;
    gap:14px; margin:0 auto; width:100%; max-width:280px;
  }
  .leaf-divider svg{ flex:none; }
  .leaf-divider .rule{ flex:1; height:1px; background:var(--gold); opacity:.55; }

  /* ---------- hero ---------- */
  .hero{
    background: radial-gradient(120% 160% at 50% -10%, var(--burgundy) 0%, var(--burgundy-deep) 78%);
    color: var(--gold-light);
    text-align:center;
    padding: 64px 24px 56px;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(196,154,105,.35);
    pointer-events:none;
  }
  .hero img.logo{
    width:min(230px, 55vw);
    display:block;
    margin:0 auto 6px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.35));
  }
  .hero .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(16px, 2.4vw, 20px);
    letter-spacing:.03em;
    color: var(--gold);
    margin: 4px 0 22px;
  }
  .hero h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.28em;
    font-size:clamp(14px, 2vw, 16px);
    margin: 22px 0 0;
    color:var(--cream);
  }

  /* ---------- category nav ---------- */
  .cat-nav{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    padding: 22px 16px; background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .cat-nav button{
    font-family:'Jost', sans-serif;
    font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:9px 18px; border-radius:999px; cursor:pointer;
    transition: all .2s ease;
  }
  .cat-nav button:hover{ border-color:var(--gold); color:var(--burgundy); }
  .cat-nav button.active{ background:var(--burgundy); border-color:var(--burgundy); color:var(--gold-light); }

  /* ---------- sections ---------- */
  main{ max-width:1120px; margin:0 auto; padding: 8px 20px 80px; }

  .category{ padding-top:52px; scroll-margin-top:90px; }
  .category-head{ text-align:center; margin-bottom:30px; }
  .category-head h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(28px, 4vw, 38px);
    color:var(--burgundy);
    margin:0 0 6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .category-head p{
    margin:0; color:var(--ink-soft); font-style:italic;
    font-family:'Cormorant Garamond', serif; font-size:18px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:28px;
    margin-top:26px;
  }

  /* ---------- product card ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    overflow:hidden;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 30px -18px rgba(69,22,31,.35);
    border-color:var(--gold);
  }
  .card .thumb{
    aspect-ratio:1/1;
    background:
      linear-gradient(var(--cream), var(--cream));
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .thumb .ph{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:#B7A588; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  }
  .card .thumb .ph svg{ width:34px; height:34px; opacity:.6; }

  .card .body{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .card h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:22px; margin:0; color:var(--ink);
  }
  .card .desc{
    font-size:13.5px; line-height:1.5; color:var(--ink-soft);
    margin:0; min-height:38px;
  }
  .card .price{
    font-family:'Cormorant Garamond', serif;
    font-weight:600; font-size:24px; color:var(--burgundy);
    margin:2px 0 4px;
  }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .field select, .qty-row{
    border:1px solid var(--line); background:var(--cream);
    font-family:'Jost', sans-serif; font-size:14px; color:var(--ink);
    padding:9px 10px; border-radius:var(--radius);
  }
  .field select{ width:100%; cursor:pointer; }

  .qty-row{ display:flex; align-items:center; justify-content:space-between; padding:5px; }
  .qty-row button{
    width:30px; height:30px; border:1px solid var(--line); background:var(--paper);
    color:var(--burgundy); font-size:16px; cursor:pointer; border-radius:var(--radius);
    line-height:1;
  }
  .qty-row button:hover{ background:var(--gold-light); border-color:var(--gold); }
  .qty-row input{
    width:44px; text-align:center; border:none; background:none;
    font-family:'Jost', sans-serif; font-size:14px; color:var(--ink);
  }
  .qty-row input:focus{ outline:none; }

  .cta{
    margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    background:var(--burgundy); color:var(--gold-light);
    border:none; padding:12px 14px; cursor:pointer;
    font-family:'Jost', sans-serif; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
    border-radius:var(--radius);
    transition: background .2s ease;
  }
  .cta:hover{ background:var(--burgundy-deep); }
  .cta svg{ width:16px; height:16px; flex:none; }
  .cta:focus-visible, .cat-nav button:focus-visible, .qty-row button:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  /* ---------- footer ---------- */
  footer{
    background:var(--burgundy-deep); color:var(--gold-light);
    text-align:center; padding:46px 20px 34px;
  }
  footer .leaf-divider .rule{ background:var(--gold); opacity:.4; }
  footer h3{
    font-family:'Cormorant Garamond', serif; font-weight:500; font-style:italic;
    font-size:22px; margin:20px 0 10px; color:var(--gold);
  }
  footer p{ margin:4px 0; font-size:14px; color:#E9DCC4; }
  footer a{ color:var(--gold); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
  footer .fine{ margin-top:22px; font-size:11px; letter-spacing:.08em; color:#B79A83; }

  @media (max-width: 480px){
    .grid{ grid-template-columns:1fr 1fr; gap:14px; }
    .card .body{ padding:12px 12px 14px; gap:7px; }
    .card h3{ font-size:17px; }
    .card .price{ font-size:19px; }
    .cta{ font-size:11px; padding:10px 8px; }
  }
</style>
</head>

<script>
/* =========================================================================

// Número de WhatsApp que vai receber os pedidos (com DDI + DDD, só números)

const WHATSAPP_NUMBER = "19974151771"; // <-- TROQUE pelo seu número

// Catálogo de produtos. Copie um bloco { ... } para adicionar um produto novo.
// image: cole aqui um link de imagem, ou deixe "" para mostrar o quadro de placeholder.
// specs: lista de opções (aroma, cor, tamanho...). Deixe [] se o produto não tiver variação.
// specLabel: o nome do campo de variação (ex: "Aroma", "Cor", "Tamanho").
const PRODUTOS = [
  {

  },
  {

    image: "../Catalogo/img/1l catalogo.png",
    specLabel: "Aroma",
    specs: ["Bambu", "Chá Branco", "Capim Limão", "Lavanda", "Dama da noite", "Vanilla Black"]
  },
  /*{

  },
  {

    preco: 0,
    descricao: "Breve descrição do produto aqui.",
    image: "",
    specLabel: "Tamanho",
    specs: ["P", "M", "G"]
  },*/
  {
    categoria: "Decoração",
    nome: "Kit 3 mini vasos",
    preco: 20,
    descricao: "Kit 3 mini vasos decorativos de cerâmica com flores variadas.",
    image: "../Catalogo/img/original.jpeg",
    specLabel: "",
    specs: []
  },
  {
    categoria: "Decoração",
    nome: "Vazo Decorativo 4 pernas",
    preco: 32,
    descricao: "Vazo decorativo com 4 pernas, ideal para decoração de ambientes.",
    image:"../Catalogo/img/fundo branco.png",
    specLabel: "Cor",
    specs: ["Branco", "Preto"]
  },
  {
    categoria: "Decoração",
    nome: "Jogo de 3 xícaras verde",
    preco: 45,
    descricao: "Breve descrição do produto aqui.",
    image: "../Catalogo/img/xicara verde.png",
    specLabel: "",

  },
  {
    categoria: "Decoração",

    preco: 28,
    descricao: "xícara personalizada com colante de vinil exclusiva acompanhada do pires, ideal para presentear ou decorar sua cozinha.",

  {

    specLabel: "",

];

/* =========================================================================
   MOTOR DO CATÁLOGO — não precisa editar daqui pra baixo
   ========================================================================= */

const fmtPrice = v => v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

const placeholderSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-6 5"/></svg>`;

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-');
}

function buildWhatsAppLink(produto, qty, spec){
  const linhas = [
    "Olá! Vim pelo catálogo Glamuro e quero fazer um pedido:",
    "",
    `Produto: ${produto.nome}`,
    `Quantidade: ${qty}`,
  ];
  if (spec) linhas.push(`${produto.specLabel || 'Especificação'}: ${spec}`);
  linhas.push(`Preço unitário: ${fmtPrice(produto.preco)}`);
  const msg = encodeURIComponent(linhas.join("\n"));
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
}

function cardTemplate(produto, idx){
  const hasSpecs = produto.specs && produto.specs.length > 0;
  const specOptions = hasSpecs
    ? produto.specs.map(s => `<option value="${s}">${s}</option>`).join('')
    : '';

  return `
  <article class="card" data-cat="${slug(produto.categoria)}">
    <div class="thumb">
      ${produto.image
        ? `<img src="${produto.image}" alt="${produto.nome}">`
        : `<div class="ph">${placeholderSVG}<span>Foto do produto</span></div>`}
    </div>
    <div class="body">
      <h3>${produto.nome}</h3>
      <p class="desc">${produto.descricao}</p>
      <p class="price">${fmtPrice(produto.preco)}</p>

      ${hasSpecs ? `
      <div class="field">
        <label for="spec-${idx}">${produto.specLabel || 'Opção'}</label>
        <select id="spec-${idx}">${specOptions}</select>
      </div>` : ''}

      <div class="field">
        <label>Quantidade</label>
        <div class="qty-row">
          <button type="button" class="qty-minus" aria-label="Diminuir quantidade">–</button>
          <input type="text" inputmode="numeric" value="1" id="qty-${idx}" aria-label="Quantidade">
          <button type="button" class="qty-plus" aria-label="Aumentar quantidade">+</button>
        </div>
      </div>

      <button type="button" class="cta" data-idx="${idx}">
        <svg viewBox="0 0 32 32" fill="currentColor"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.633.86 5.07 2.317 7.05L5 29l7.14-1.87A11.94 11.94 0 0 0 16 27c6.627 0 12-5.373 12-12S22.628 3 16.001 3Zm0 21.8c-1.99 0-3.86-.55-5.46-1.51l-.39-.23-4.24 1.11 1.13-4.13-.25-.42A9.77 9.77 0 0 1 5.2 15C5.2 9.06 10.06 4.2 16 4.2S26.8 9.06 26.8 15 21.94 24.8 16.001 24.8Zm5.4-7.34c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.73-1.63-2.03-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
        Pedir no WhatsApp
      </button>
    </div>
  </article>`;
}

function render(){
  const categorias = [...new Set(PRODUTOS.map(p => p.categoria))];
  const nav = document.getElementById('catNav');
  const main = document.getElementById('main');

  nav.innerHTML = categorias.map((c,i) =>
    `<button data-target="${slug(c)}" class="${i===0?'active':''}">${c}</button>`
  ).join('');

  main.innerHTML = categorias.map(cat => {
    const items = PRODUTOS
      .map((p, idx) => ({...p, idx}))
      .filter(p => p.categoria === cat);
    return `
    <section class="category" id="${slug(cat)}">
      <div class="category-head">
        <h2>${cat}</h2>
      </div>
      <div class="grid">
        ${items.map(p => cardTemplate(p, p.idx)).join('')}
      </div>
    </section>`;
  }).join('');

  // navegação por categoria
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target)?.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });

  // quantidade +/-
  document.querySelectorAll('.qty-row').forEach(row => {
    const input = row.querySelector('input');
    row.querySelector('.qty-minus').addEventListener('click', () => {
      input.value = Math.max(1, (parseInt(input.value)||1) - 1);
    });
    row.querySelector('.qty-plus').addEventListener('click', () => {
      input.value = (parseInt(input.value)||1) + 1;
    });
    input.addEventListener('change', () => {
      const v = parseInt(input.value);
      input.value = (!v || v < 1) ? 1 : v;
    });
  });

  // botão pedir no whatsapp
  document.querySelectorAll('.cta').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.idx;
      const produto = PRODUTOS[idx];
      const qty = document.getElementById(`qty-${idx}`).value || 1;
      const specEl = document.getElementById(`spec-${idx}`);
      const spec = specEl ? specEl.value : null;
      window.open(buildWhatsAppLink(produto, qty, spec), '_blank');
    });
  });
}

render();
</script>
